services:
  astro:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
    expose:
      - "4321"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - astro
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
